# Unison: the standard width, scaled to 93.4% after the build (build/scale-unison.py) so its
# x-height matches Source Sans 3's. Its weights are heavier, so the scaled stems meet their
# targets. Its side spacing is 20% tighter than Iosevka's, so its letters come closer to
# Source Sans 3's widths, and its capitals and figures are built at 702 units, which scaling
# brings to Source Sans 3's cap height of 656 (702 = 656 / 0.934).

[buildPlans.CompanionMonoUnison]
family = "Companion Mono Unison"
spacing = "term"
noCvSs = true

[buildPlans.CompanionMonoUnison.variants]
inherits = "buildPlans.CompanionMono"

[buildPlans.CompanionMonoUnison.ligations]
enables = []

[buildPlans.CompanionMonoUnison.widths]
inherits = "buildPlans.CompanionMono"

[buildPlans.CompanionMonoUnison.weights.Light] # Unison only: for code in Source Sans 3 Light.
shape = 232
menu = 300
css = 300

[buildPlans.CompanionMonoUnison.weights.Regular]
shape = 489
menu = 400
css = 400

[buildPlans.CompanionMonoUnison.weights.SemiBold]
shape = 665
menu = 600
css = 600

[buildPlans.CompanionMonoUnison.weights.Bold]
shape = 838
menu = 700
css = 700

[buildPlans.CompanionMonoUnison.slopes]
inherits = "buildPlans.CompanionMono"

[buildPlans.CompanionMonoUnison.metricOverride]
leading = 1326
symbolMid = 337
periodSize = "default_periodSize * 0.85"
sb = "default_sb * 0.8"
cap = 702

[buildPlans.CompanionMonoUnison.namingOverride]
version = "1.5.0"
copyright = "Copyright 2015-2026, Renzhi Li (aka. Belleve Invis, belleve@typeof.net). Companion Mono modifications copyright 2026, Peter Baumgartner."
manufacturer = "Peter Baumgartner"
designer = "Renzhi Li (Iosevka); Peter Baumgartner (Companion Mono)"
description = "Companion Mono Unison: a custom Iosevka build scaled to accompany Source Sans 3. Original Iosevka design by Renzhi Li. This is an independent derivative, not an Adobe or Iosevka official release."

